<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>O.G Boutique | Nigerian Fashion & Lifestyle</title>

  <meta
    name="description"
    content="O.G Boutique — Nigerian fashion, clothing, footwear, bags and accessories in Lafia, Nasarawa."
  >

  <meta name="theme-color" content="#8b4f2f">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #faf7f2;
      color: #211914;
      line-height: 1.6;
    }

    img {
      width: 100%;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input {
      font-family: inherit;
    }

    /* ==============================
       HEADER
    ============================== */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,0.97);
      border-bottom: 1px solid #eadfd5;
      backdrop-filter: blur(12px);
    }

    .navbar {
      min-height: 76px;
      max-width: 1150px;
      margin: auto;
      padding: 0 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span {
      color: #a45f39;
    }

    .menu-button {
      width: 45px;
      height: 45px;
      border: none;
      background: transparent;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;

      cursor: pointer;
    }

    .menu-button span {
      width: 28px;
      height: 3px;
      border-radius: 5px;
      background: #211914;
    }

    .nav-links {
      display: none;

      position: absolute;
      top: 76px;
      left: 0;
      right: 0;

      background: white;
      padding: 10px 20px 20px;

      border-bottom: 1px solid #eadfd5;
    }

    .nav-links.active {
      display: block;
    }

    .nav-links a {
      display: block;
      padding: 13px 4px;

      font-weight: 700;
      border-bottom: 1px solid #f0e8e0;
    }


    /* ==============================
       HERO
    ============================== */

    .hero {
      min-height: 650px;

      position: relative;

      display: flex;
      align-items: center;

      color: white;

      background:
  linear-gradient(
    rgba(34, 20, 13, 0.48),
    rgba(34, 20, 13, 0.68)
  ),
  url("https://commons.wikimedia.org/wiki/Special:Redirect/file/A%20Nigerian%20lady%20in%20Ankara%20clothing.jpg")
  center / cover no-repeat;
    }

    .hero-content {
      width: 100%;
      max-width: 1150px;
      margin: auto;
      padding: 70px 24px;
    }

    .hero-label {
      color: #f1c6a7;

      font-size: 13px;
      font-weight: 900;

      letter-spacing: 4px;
      text-transform: uppercase;

      margin-bottom: 16px;
    }

    .hero h1 {
      max-width: 700px;

      font-size: clamp(47px, 12vw, 86px);
      line-height: 0.98;

      letter-spacing: -3px;

      margin-bottom: 24px;
    }

    .hero h1 span {
      color: #e2a477;
    }

    .hero p {
      max-width: 620px;

      color: #f6eee8;

      font-size: 18px;
      line-height: 1.75;

      margin-bottom: 30px;
    }

    .hero-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;

      max-width: 400px;
    }

    .button {
      min-height: 56px;

      padding: 14px 22px;

      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: 800;

      transition: 0.2s;
    }

    .button-primary {
      background: #b66d42;
      color: white;
    }

    .button-primary:hover {
      background: #965331;
      transform: translateY(-2px);
    }

    .button-light {
      background: white;
      color: #211914;
    }

    .button-light:hover {
      transform: translateY(-2px);
    }


    /* ==============================
       INTRO CARDS
    ============================== */

    .intro {
      max-width: 1100px;
      margin: -45px auto 0;

      position: relative;
      z-index: 5;

      padding: 0 18px;
    }

    .intro-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .intro-card {
      background: white;

      border: 1px solid #eadfd5;
      border-radius: 17px;

      padding: 22px 15px;

      text-align: center;

      box-shadow: 0 12px 30px rgba(46,31,21,0.08);
    }

    .intro-icon {
      font-size: 27px;
      margin-bottom: 6px;
    }

    .intro-card h3 {
      font-size: 15px;
      margin-bottom: 3px;
    }

    .intro-card p {
      font-size: 12px;
      color: #777;
    }


    /* ==============================
       GENERAL
    ============================== */

    section {
      padding: 75px 18px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 38px;
    }

    .section-label {
      color: #a45f39;

      font-size: 12px;
      font-weight: 900;

      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .section-heading h2 {
      font-size: clamp(31px, 7vw, 50px);
      line-height: 1.1;

      margin: 8px 0 12px;
    }

    .section-heading p {
      max-width: 620px;
      margin: auto;

      color: #777;
    }


    /* ==============================
       NIGERIAN STYLE SECTION
    ============================== */

    .culture {
      background: #fff;
    }

    .culture-grid {
      display: grid;
      gap: 15px;
    }

    .culture-card {
      min-height: 260px;

      position: relative;

      overflow: hidden;

      border-radius: 20px;

      color: white;

      display: flex;
      align-items: flex-end;

      padding: 22px;
    }

    .culture-card::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          transparent 20%,
          rgba(0,0,0,0.78)
        );
    }

    .culture-card img {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      transition: 0.4s;
    }

    .culture-card:hover img {
      transform: scale(1.06);
    }

    .culture-content {
      position: relative;
      z-index: 2;
    }

    .culture-content small {
      color: #f1c39f;

      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .culture-content h3 {
      font-size: 25px;
      margin-top: 5px;
    }

    .culture-content p {
      font-size: 13px;
      color: #eee;
    }


    /* ==============================
       CATEGORIES
    ============================== */

    .categories {
      background: #f4ede5;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .category {
      position: relative;

      height: 220px;

      overflow: hidden;

      border-radius: 18px;

      color: white;

      display: flex;
      align-items: flex-end;

      padding: 20px;
    }

    .category::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          transparent 20%,
          rgba(0,0,0,0.78)
        );
    }

    .category img {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      transition: 0.4s;
    }

    .category:hover img {
      transform: scale(1.07);
    }

    .category-content {
      position: relative;
      z-index: 2;
    }

    .category h3 {
      font-size: 22px;
    }

    .category p {
      font-size: 13px;
      opacity: 0.9;
    }


    /* ==============================
       PRODUCTS
    ============================== */

    .products {
      background: #faf7f2;
    }

    .search {
      max-width: 650px;
      margin: 0 auto 22px;
    }

    .search input {
      width: 100%;

      height: 55px;

      padding: 0 19px;

      border: 1px solid #ddd0c4;
      border-radius: 13px;

      background: white;

      outline: none;

      font-size: 15px;
    }

    .search input:focus {
      border-color: #a45f39;
    }

    .filters {
      display: flex;
      gap: 8px;

      overflow-x: auto;

      padding-bottom: 20px;

      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter {
      flex-shrink: 0;

      padding: 10px 17px;

      border: 1px solid #ddd0c4;
      border-radius: 30px;

      background: white;

      cursor: pointer;

      font-size: 13px;
      font-weight: 800;
    }

    .filter.active {
      background: #241a15;
      color: white;
      border-color: #241a15;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .product {
      background: white;

      border: 1px solid #eadfd5;

      border-radius: 16px;

      overflow: hidden;
    }

    .product-image {
      height: 220px;

      position: relative;

      overflow: hidden;

      background: #ddd;
    }

    .product-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      transition: 0.4s;
    }

    .product:hover .product-image img {
      transform: scale(1.05);
    }

    .badge {
      position: absolute;

      top: 10px;
      left: 10px;

      background: white;

      padding: 5px 9px;

      border-radius: 20px;

      font-size: 10px;
      font-weight: 900;

      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    }

    .product-info {
      padding: 15px;
    }

    .product-category {
      color: #a45f39;

      font-size: 9px;

      font-weight: 900;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .product h3 {
      font-size: 16px;

      line-height: 1.3;

      margin: 5px 0;
    }

    .price {
      font-weight: 800;

      font-size: 13px;

      margin: 8px 0 12px;
    }

    .product-buttons {
      display: flex;
      gap: 7px;
    }

    .product-buttons a,
    .product-buttons button {
      flex: 1;

      min-height: 40px;

      border-radius: 9px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #ddd0c4;

      background: white;

      font-size: 11px;
      font-weight: 800;

      cursor: pointer;
    }

    .product-buttons .whatsapp {
      background: #1fa85b;
      border-color: #1fa85b;

      color: white;
    }


    /* ==============================
       ABOUT
    ============================== */

    .about {
      background: #231914;
      color: white;
    }

    .about-grid {
      display: grid;
      gap: 30px;
      align-items: center;
    }

    .about-image {
      height: 360px;

      overflow: hidden;

      border-radius: 20px;
    }

    .about-image img {
      height: 100%;
      object-fit: cover;
    }

    .about-label {
      color: #e1a174;

      font-size: 12px;
      font-weight: 900;

      letter-spacing: 3px;

      text-transform: uppercase;
    }

    .about-text h2 {
      font-size: 38px;

      line-height: 1.1;

      margin: 9px 0 17px;
    }

    .about-text p {
      color: #d6cbc3;

      margin-bottom: 17px;
    }

    .about-list {
      list-style: none;
    }

    .about-list li {
      margin: 9px 0;

      color: #eee;
    }


    /* ==============================
       NIGERIAN LIFESTYLE BANNER
    ============================== */

    .lifestyle {
      min-height: 400px;

      display: flex;
      align-items: center;

      color: white;

      background:
        linear-gradient(
          rgba(38,21,13,0.60),
          rgba(38,21,13,0.75)
        ),
        url("https://www.gulftoday.ae/gulftoday/uploads/images/2025/08/28/997901.jpg")
        center / cover no-repeat;
    }

    .lifestyle-content {
      max-width: 650px;
      margin: auto;

      text-align: center;
    }

    .lifestyle-content small {
      color: #f1c39f;

      font-weight: 900;

      letter-spacing: 3px;

      text-transform: uppercase;
    }

    .lifestyle-content h2 {
      font-size: clamp(35px, 8vw, 58px);

      line-height: 1.05;

      margin: 10px 0 15px;
    }

    .lifestyle-content p {
      color: #f0e8e2;

      margin-bottom: 25px;
    }


    /* ==============================
       DELIVERY
    ============================== */

    .delivery {
      background: #f4ede5;
    }

    .delivery-box {
      background:
        linear-gradient(
          135deg,
          #a96038,
          #754027
        );

      color: white;

      border-radius: 23px;

      padding: 40px 24px;

      text-align: center;
    }

    .delivery-box h2 {
      font-size: 32px;

      line-height: 1.15;

      margin-bottom: 12px;
    }

    .delivery-box p {
      max-width: 600px;

      margin: auto auto 22px;

      color: #f6e8df;
    }

    .delivery-box .button {
      max-width: 330px;

      margin: auto;
    }


    /* ==============================
       CONTACT
    ============================== */

    .contact {
      background: white;
    }

    .contact-grid {
      display: grid;
      gap: 14px;
    }

    .contact-card {
      padding: 23px;

      background: #faf7f2;

      border: 1px solid #eadfd5;

      border-radius: 17px;

      text-align: center;
    }

    .contact-icon {
      font-size: 28px;

      margin-bottom: 5px;
    }

    .contact-card h3 {
      font-size: 16px;
    }

    .contact-card p {
      color: #777;

      font-size: 14px;
    }


    /* ==============================
       FOOTER
    ============================== */

    footer {
      background: #15100d;

      color: white;

      padding: 45px 20px 25px;
    }

    .footer-container {
      max-width: 1100px;
      margin: auto;
    }

    .footer-grid {
      display: grid;
      gap: 28px;
    }

    .footer-brand h2 {
      font-size: 25px;
    }

    .footer-brand span {
      color: #c47b50;
    }

    .footer-brand p {
      color: #aaa;

      max-width: 370px;

      margin-top: 10px;
    }

    .footer-column h3 {
      margin-bottom: 9px;
    }

    .footer-column a {
      display: block;

      color: #aaa;

      margin: 7px 0;

      font-size: 14px;
    }

    .copyright {
      border-top: 1px solid #302823;

      margin-top: 30px;

      padding-top: 20px;

      text-align: center;

      color: #888;

      font-size: 12px;
    }


    /* ==============================
       WHATSAPP FLOAT
    ============================== */

    .floating-whatsapp {
      position: fixed;

      right: 17px;
      bottom: 18px;

      width: 58px;
      height: 58px;

      border-radius: 50%;

      background: #25d366;

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;

      box-shadow: 0 8px 25px rgba(0,0,0,0.25);

      z-index: 999;
    }


    /* ==============================
       MODAL
    ============================== */

    .modal {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 3000;

      background: rgba(0,0,0,0.70);

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 450px;

      background: white;

      border-radius: 20px;

      overflow: hidden;

      position: relative;
    }

    .modal-box img {
      height: 270px;

      object-fit: cover;
    }

    .modal-content {
      padding: 22px;
    }

    .modal-content h2 {
      margin: 5px 0 8px;
    }

    .modal-content p {
      color: #777;

      margin-bottom: 17px;
    }

    .close-modal {
      position: absolute;

      top: 12px;
      right: 12px;

      width: 38px;
      height: 38px;

      border: none;

      border-radius: 50%;

      background: white;

      font-size: 22px;

      cursor: pointer;
    }


    /* ==============================
       DESKTOP
    ============================== */

    @media (min-width: 700px) {

      .navbar {
        min-height: 82px;
      }

      .menu-button {
        display: none;
      }

      .nav-links {
        position: static;

        display: flex !important;

        align-items: center;

        gap: 25px;

        padding: 0;

        border: none;

        background: transparent;
      }

      .nav-links a {
        padding: 5px;

        border: none;

        font-size: 14px;
      }

      .hero {
        min-height: 680px;
      }

      .hero-buttons {
        flex-direction: row;

        max-width: none;
      }

      .hero-buttons .button {
        min-width: 210px;
      }

      .intro-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .culture-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .culture-card {
        min-height: 330px;
      }

      .category-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .category {
        height: 290px;
      }

      .product-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .product-image {
        height: 280px;
      }

      .about-grid {
        grid-template-columns: 1fr 1fr;
      }

      .contact-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .footer-grid {
        grid-template-columns: 2fr 1fr 1fr;
      }
    }


    /* ==============================
       SMALL PHONES
    ============================== */

    @media (max-width: 390px) {

      .hero {
        min-height: 600px;
      }

      .hero h1 {
        font-size: 46px;
      }

      .hero p {
        font-size: 16px;
      }

      .product-image {
        height: 190px;
      }

      .culture-card {
        min-height: 220px;
      }

      .category {
        height: 190px;
      }

    }

  </style>
</head>


<body>


  <!-- ==============================
       HEADER
  ============================== -->

  <header>

    <nav class="navbar">

      <a href="#home" class="logo">
        O.G <span>BOUTIQUE</span>
      </a>

      <button
        class="menu-button"
        id="menuButton"
        aria-label="Open navigation"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="nav-links" id="navLinks">

        <a href="#home">Home</a>

        <a href="#culture">Nigerian Style</a>

        <a href="#categories">Collections</a>

        <a href="#products">Products</a>

        <a href="#about">About</a>

        <a href="#contact">Contact</a>

      </div>

    </nav>

  </header>



  <!-- ==============================
       HERO
  ============================== -->

  <main>

    <section class="hero" id="home">

      <div class="hero-content">

        <div class="hero-label">
          Nigerian Fashion • Style • Confidence
        </div>

        <h1>
          Wear Your <span>Story.</span>
        </h1>

        <p>
          Discover fashion inspired by Nigerian style, culture and
          everyday lifestyle — from beautiful clothing and footwear
          to bags and accessories.
        </p>

        <div class="hero-buttons">

          <a
            href="#products"
            class="button button-primary"
          >
            Shop Collection
          </a>

          <a
            href="https://wa.me/2348164330832?text=Hello%20O.G%20Boutique%2C%20I%20found%20your%20website%20and%20would%20like%20to%20make%20an%20enquiry."
            target="_blank"
            rel="noopener"
            class="button button-light"
          >
            Order on WhatsApp
          </a>

        </div>

      </div>

    </section>



    <!-- ==============================
         INTRO
    ============================== -->

    <div class=
